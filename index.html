<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZENPOF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --noir: #0a0a0a;
      --blanc: #f5f2ec;
      --acid: #c8f23a;
      --gris: #141414;
      --gris2: #222;
      --muted: #666;
    }
    html, body { height: 100%; }
    body {
      background: var(--noir);
      color: var(--blanc);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
    }
    .site {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header {
      padding: 2rem 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.2em;
      color: var(--blanc);
      text-decoration: none;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.05s forwards;
    }
    .logo span { color: var(--acid); }
    .tuiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 0 2px;
    }
    .tuile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 3rem 2.5rem;
      background: var(--gris);
      text-decoration: none;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.35s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.7s ease forwards;
    }
    .tuile:nth-child(1) { animation-delay: 0.1s; }
    .tuile:nth-child(2) { animation-delay: 0.22s; }
    .tuile:nth-child(3) { animation-delay: 0.34s; }
    .tuile::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .tuile-sports::before  { background: radial-gradient(ellipse at 30% 70%, rgba(200,242,58,0.12), transparent 65%); }
    .tuile-musique::before { background: radial-gradient(ellipse at 50% 60%, rgba(180,100,255,0.12), transparent 65%); }
    .tuile-actu::before    { background: radial-gradient(ellipse at 70% 70%, rgba(255,140,60,0.12), transparent 65%); }
    .tuile:hover { background: var(--gris2); }
    .tuile:hover::before { opacity: 1; }
    .tuile:hover .tuile-num { color: rgba(245,242,236,0.12); }
    .tuile:hover .tuile-arrow { transform: translate(4px, -4px); opacity: 1; }
    .tuile-sports:hover  .tuile-title { color: var(--acid); }
    .tuile-musique:hover .tuile-title { color: #c87dff; }
    .tuile-actu:hover    .tuile-title { color: #ff8c3c; }
    .tuile-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      line-height: 1;
      color: rgba(245,242,236,0.05);
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      transition: color 0.3s;
      user-select: none;
    }
    .tuile-content { position: relative; z-index: 1; }
    .tuile-label {
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }
    .tuile-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 5vw, 5.5rem);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--blanc);
      transition: color 0.3s;
    }
    .tuile-arrow {
      position: absolute;
      bottom: 2.5rem;
      right: 2.5rem;
      font-size: 1.4rem;
      color: var(--muted);
      opacity: 0.4;
      transition: transform 0.3s, opacity 0.3s;
    }
    .coming-soon { pointer-events: none; opacity: 0.4; }
    .badge {
      display: inline-block;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.2rem 0.7rem;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(245,242,236,0.4);
      margin-bottom: 0.8rem;
    }
    footer {
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    footer p {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      body { overflow: auto; }
      .site { height: auto; }
      .tuiles { grid-template-columns: 1fr; }
      .tuile { min-height: 200px; padding: 2rem 1.5rem 2.5rem; }
      .tuile-title { font-size: clamp(3rem, 15vw, 5rem); }
      header { padding: 1.5rem; }
      footer { padding: 1.2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="site">
    <header>
      <a href="index.html" class="logo">ZEN<span>POF</span></a>
    </header>
    <div class="tuiles">
      <a href="sports.html" class="tuile tuile-sports">
        <span class="tuile-num">01</span>
        <div class="tuile-content">
          <p class="tuile-label">Entraînement</p>
          <h2 class="tuile-title">SPORTS</h2>
        </div>
        <span class="tuile-arrow">↗</span>
      </a>
      <div class="tuile tuile-musique coming-soon">
        <span class="tuile-num">02</span>
        <div class="tuile-content">
          <span class="badge">Bientôt</span>
          <p class="tuile-label">Découvertes</p>
          <h2 class="tuile-title">MUSIQUE</h2>
        </div>
      </div>
      <div class="tuile tuile-actu coming-soon">
        <span class="tuile-num">03</span>
        <div class="tuile-content">
          <span class="badge">Bientôt</span>
          <p class="tuile-label">Le monde</p>
          <h2 class="tuile-title">ACTU</h2>
        </div>
      </div>
    </div>
    <footer>
      <p>www.zenpof.art</p>
    </footer>
  </div>
</body>
</html>
